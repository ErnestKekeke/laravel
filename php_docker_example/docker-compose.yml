#     depends_on:
#       - db


#   # MySQL database service
#   db:
#     # Use the official MySQL version 8 image from Docker Hub
#     image: mysql:8

#     # Custom container name
#     container_name: mysql_db

#     # Automatically restart container if it stops
#     restart: always

#     # Environment variables used to initialize MySQL
#     environment:
#       # Root (admin) password
#       MYSQL_ROOT_PASSWORD: root

#       # Database automatically created on startup
#       MYSQL_DATABASE: formdb

#       # Custom database user
#       MYSQL_USER: user

#       # Password for the custom user
